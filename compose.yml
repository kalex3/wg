services:
  wg:
    image: ghcr.io/kalex3/wg:latest
    restart: unless-stopped
    # read_only: true
    # resolv.conf is its own writable mount. /run still has to be writable
    # for the DNS backup and the iptables lock:
    # tmpfs:
    #   - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Compose defaults this to 0. Rootless Podman then fails every healthcheck
    # exec on crun 1.31, because the systemd unit that runs it cannot lower
    # its own oom score to 0. 200 is the score Podman already applies.
    oom_score_adj: 200
    env_file: wg.env
    sysctls:
      # Used when a full tunnel marks packets. Harmless for a split tunnel:
      # unmarked packets are looked up the same way either way.
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./${WG_INTERFACE:-wg0}.conf:/etc/${WG_INTERFACE:-wg0}.conf:ro
      # Same file in every container that joins this network namespace.
      # Podman would share its own resolv.conf; Docker and nerdctl would not.
      - ./resolv.conf:/etc/resolv.conf
    # Defined here as well, because Podman drops the image's HEALTHCHECK for
    # OCI-format images (e.g. when pulled from GHCR).
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]

  # Example workload: shares wg's network namespace, so every packet it sends
  # leaves through the tunnel (or, if the config is not a full tunnel, only
  # traffic matching the peers' AllowedIPs does; see wg0.conf.example).
  # Replace the image/command with your own service and publish any ports on
  # the `wg` service instead, since network settings belong to that container.
  client:
    image: alpine:3.24.4
    network_mode: service:wg
    depends_on:
      wg:
        condition: service_healthy
        # Recreate the client when wg restarts, otherwise it keeps a stale netns.
        restart: true
    restart: unless-stopped
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    command: ["sleep", "infinity"]
